name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, build, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe stamps the version into the build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test # builds dist/, then the simulator and the browser test
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload screenshots of the settings page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore

  table:
    name: Table matches hdate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate src/table.js and test/windows.json
        run: uv run tools/gen_table.py
      - name: Fail if they changed
        run: git diff --exit-code -- src/table.js test/windows.json
