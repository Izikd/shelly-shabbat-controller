# SPDX-License-Identifier: MIT
name: Release

# Publish a release, either way:
#   - push a version tag: git tag v0.1.0 && git push origin v0.1.0
#   - Actions -> Release -> Run workflow, on main, with the version (e.g. v0.1.0): no terminal
#     needed; the release creates the tag on the commit it was built from
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (creates this tag)"
        required: true

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # stamped into every built file; passed through env, never inlined into a script
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ||
            { echo "bad version: $VERSION (expected v1.2.3 or v1.2.3-alpha.1)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # a tag can be pushed on any commit, and Run workflow started from any branch: only
      # what is on main is released (it reaches users' devices)
      - name: Check that the commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "commit $GITHUB_SHA is not on main: not released"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test # the release is built and tested in one go
      - name: Check the version stamp
        run: grep -q "version $VERSION " dist/shabbat_controller.js
      # GitHub's --generate-notes lists merged pull requests; this project commits to main
      # directly, so the notes are the commit subjects since the previous release instead
      - name: Release notes
        run: tools/release_notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          $( [ "$GITHUB_EVENT_NAME" = push ] && echo --verify-tag || echo --target "$GITHUB_SHA" )
          $( case "$VERSION" in *-*) echo --prerelease ;; esac )
          dist/shabbat_controller.js dist/shabbat_ui.js dist/manifest.json
      # The Shelly script library (Scripts -> Library -> Configure URL) reads
      # https://raw.githubusercontent.com/<repo>/library/manifest.json and loads each script
      # from next to it, so the `library` branch holds only the latest release's build. The
      # settings page's Check for updates reads the same branch.
      # Channels: a stable version (v1.2.3) goes to `library`; a pre-release (v1.2.3-beta.1)
      # only to `library-beta`, for testers (the page's "Beta versions" switch, or that branch's
      # manifest URL in the Shelly library), so it never reaches stable users.
      - name: Publish the script library (library or library-beta branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) BRANCH=library-beta ;; *) BRANCH=library ;; esac
          mkdir lib && cp dist/manifest.json dist/shabbat_controller.js dist/shabbat_ui.js lib/
          cd lib
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Script library for $VERSION"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"
